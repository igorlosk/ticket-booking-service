spring:
  application:
    name: ticket-booking-service
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false # страницы с 0, как принято в API

  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate    # ← ИЗМЕНИЛИ: update → validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    # default-schema: public  # можно указать явно

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    liquibase: info

springdoc:
  api-docs:
    path: /v3/api-docs          # где доступна спецификация в JSON
  swagger-ui:
    path: /swagger-ui.html      # где открывается UI
    operations-sorter: method   # сортировка эндпоинтов по HTTP-методу
    tags-sorter: alpha          # сортировка тегов по алфавиту
  show-actuator: false          # не показывать actuator-эндпоинты (если будут)

